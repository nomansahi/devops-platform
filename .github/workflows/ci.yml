name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Validate Terraform
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2

      - name: Check formatting
        run: terraform -chdir=terraform fmt -check

      - name: Initialize providers
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=terraform validate

  application:
    name: Build, test and publish image
    needs: terraform
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t practice-app:ci ./app

      - name: Test application behavior
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/app/test_app.py:/app/test_app.py:ro" \
            --entrypoint python \
            practice-app:ci \
            -m unittest discover -s /app -p test_app.py

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/nomansahi/devops-platform
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker tag practice-app:ci "$IMAGE:$COMMIT_SHA"
          docker push "$IMAGE:$COMMIT_SHA"
          echo "Published image: $IMAGE:$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"